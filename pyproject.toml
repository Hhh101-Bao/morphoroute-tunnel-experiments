[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morphoroute-tunnel-experiments"
version = "0.1.0"
description = "Auditable railway tunnel lining multi-disease instance-segmentation experiments"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Experiment Team"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
